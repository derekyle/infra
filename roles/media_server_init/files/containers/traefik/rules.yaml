http:
  middlewares:
    # Tesla 3P integration expects the public key at /.well-known/appspecific/... ;
    # Home Assistant serves it at /local/com.tesla.3p.public-key.pem
    middleware-tesla-3p-public-key-path:
      replacePath:
        path: /local/com.tesla.3p.public-key.pem
  routers:
    router-tesla-3p-public-key:
      entryPoints:
        - websecure
      rule: Host(`house.dc5.in`) && Path(`/.well-known/appspecific/com.tesla.3p.public-key.pem`)
      service: service-homeassistant
      middlewares:
        - middleware-tesla-3p-public-key-path
      tls:
        certResolver: myresolver
      priority: 100
    router-homeassistant:
      entryPoints:
        - websecure
      rule: Host(`house.dc5.in`)
      service: service-homeassistant
      priority: 1
      tls:
        certResolver: myresolver
    router-homeassistant-endpoint:
      entryPoints:
        - websecure
      rule: Host(`alexa-endpoint.dc5.in`)
      service: service-homeassistant
      tls:
        certResolver: myresolver
  services:
    service-homeassistant:
      loadBalancer:
        servers:
        - url: "http://192.168.1.100:8123"
    service-unifi:
      loadBalancer:
        servers:
        - url: "https://192.168.1.100:8443"
    service-pikvm:
      loadBalancer:
        servers:
        - url: "https://192.168.1.122:443"