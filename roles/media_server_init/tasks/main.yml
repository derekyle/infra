---

- name: ensure hostname is set correctly
  hostname:
    name: "mediaserver"
  tags:
    - init

- name: disks
  include_tasks:
    file: disks.yml
    apply:
      tags:
        - disks
        - init
        - mount
  tags:
    - disks
    - init
    - mount

- name: install mergerfs-tools
  include_tasks:
    file: mergerfs-tools.yml
    apply:
      tags:
        - mergerfs-tools
        - init
  tags:
    - mergerfs-tools
    - init

- name: install all container apps
  include_tasks:
    file: container-apps.yml
    apply:
      tags:
        - container-apps
        - init
  tags:
    - container-apps
    - init

- name: file-sharing samba setup
  include_tasks:
    file: file-sharing.yml
    apply:
      tags:
        - file-sharing
        - init
  tags:
    - file-sharing
    - init

